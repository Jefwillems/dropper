replicaCount: 1

image:
  repository: ghcr.io/jefwillems/dropper
  pullPolicy: IfNotPresent
  # Overrides the image tag. Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Set ingress.enabled=true to expose via a standard Kubernetes Ingress.
# ingress and httpRoute are mutually exclusive.
ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: dropper.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: dropper-tls
  #   hosts:
  #     - dropper.example.com

# Set httpRoute.enabled=true to expose via a Gateway API HTTPRoute.
# ingress and httpRoute are mutually exclusive.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      namespace: default
  hostnames:
    - dropper.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

nodeSelector: {}
tolerations: []
affinity: {}
